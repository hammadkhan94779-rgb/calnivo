<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CALNIVO — Teaser</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root{--ember:#ff3d00;--amber:#ff8a00;--slate:#1b2230;--paper:#f4f4f6;--display:"Archivo","Arial Black","Helvetica Neue",Impact,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:var(--display);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;overflow:hidden;background:#000}
  #cam{position:absolute;inset:0;will-change:transform}
  .scene{position:absolute;inset:0;display:none;overflow:hidden}
  .scene.on{display:flex;align-items:center;justify-content:center;flex-direction:column}
  .xw{font-stretch:125%;font-variation-settings:"wdth" 125}

  /* overlays */
  #grain{position:absolute;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;mix-blend-mode:overlay;opacity:.22;image-rendering:pixelated}
  #flash{position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0;background:#fff}
  .bar{position:absolute;left:0;right:0;height:0;background:#000;z-index:25;pointer-events:none}
  #barT{top:0}#barB{bottom:0}

  /* gate */
  #gate{background:#000;color:#fff;gap:22px;cursor:pointer;text-align:center;z-index:50}
  #gate img{height:92px;width:auto;filter:drop-shadow(0 0 28px rgba(255,80,0,.45))}
  #gate p{font-size:13px;letter-spacing:.38em;padding-left:.38em;font-weight:800;opacity:.75}
  #gate small{font-size:11px;opacity:.4;letter-spacing:.2em}

  /* ---- call ---- */
  #call{background:radial-gradient(70% 55% at 20% 15%,#8a34ff 0,transparent 70%),radial-gradient(60% 60% at 90% 25%,#1f42ff 0,transparent 70%),radial-gradient(70% 55% at 65% 100%,#ff2fd0 0,transparent 70%),#160636;justify-content:flex-start;color:#fff;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  #call .sb{position:absolute;top:16px;left:26px;right:26px;display:flex;justify-content:space-between;font-weight:600;font-size:15px}
  #call .sb .ic{display:flex;gap:6px;align-items:center}
  .sig{display:flex;gap:2px;align-items:flex-end;height:11px}.sig i{width:3px;background:#fff;border-radius:1px}
  .bat{width:24px;height:11px;border:1.5px solid #fff9;border-radius:3px;position:relative}.bat::after{content:"";position:absolute;inset:1.5px;background:#fff;border-radius:1px}
  #callBody{display:flex;flex-direction:column;align-items:center;margin-top:13vh}
  #call .who{font-size:clamp(28px,5vw,40px);font-weight:500;display:flex;align-items:center;gap:12px}
  #call .who img{height:1.15em;width:auto}
  #call .sub{opacity:.7;margin-top:6px;font-size:18px}
  #call .row{display:flex;gap:min(26vw,190px);margin-top:30px}
  #call .pill{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px}
  #call .pill i{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(12px);display:grid;place-items:center;font-style:normal;font-size:20px}
  #slider{position:absolute;bottom:9vh;left:50%;transform:translateX(-50%);width:min(88vw,430px);height:66px;border-radius:40px;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,70,220,.92));overflow:hidden;box-shadow:0 0 40px rgba(255,60,220,.35)}
  #slider span{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;padding-left:44px;background:linear-gradient(100deg,#fff9 30%,#fff 50%,#fff9 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
  @keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
  #knob{position:absolute;top:4px;left:4px;width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:25px}
  #call .home{position:absolute;bottom:10px;left:50%;width:140px;height:5px;border-radius:3px;background:#fff;transform:translateX(-50%)}
  #call.ring #callBody{animation:vib .5s linear infinite}
  @keyframes vib{0%,100%{transform:translateX(0)}20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-1.5px)}80%{transform:translateX(1.5px)}}

  /* ---- words ---- */
  #words.light{background:var(--paper);color:#000}
  #words.dark{background:#000;color:#fff}
  #words .idx{font-size:clamp(11px,1.7vw,14px);letter-spacing:.4em;padding-left:.4em;font-weight:700;margin-bottom:2.4vh;opacity:.55}
  #words .w{font-size:clamp(44px,12vw,168px);font-weight:900;letter-spacing:-.02em;line-height:1;white-space:nowrap;display:flex}
  #words .ch{display:inline-block;will-change:transform}
  #words .ticks{position:absolute;bottom:7vh;display:flex;gap:10px}
  #words .ticks i{width:22px;height:4px;background:currentColor;opacity:.18;transition:opacity .12s}
  #words .ticks i.f{opacity:1}

  /* ---- eye ---- */
  #eye{background:#000}
  #skin{position:absolute;inset:0;background:radial-gradient(ellipse at 52% 48%,#c4814f 0,#a56a40 38%,#74442a 75%,#44261a 100%)}
  #face{position:absolute;inset:0;width:100%;height:100%}
  #dim{position:absolute;inset:0;background:#000;opacity:.7;pointer-events:none}
  #ember{position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,70,0,0) 25%,rgba(255,110,20,.75) 100%);mix-blend-mode:screen;opacity:0;pointer-events:none}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.88) 100%);pointer-events:none}
  #flare{position:absolute;left:50%;top:50%;width:96vw;height:5px;margin-left:-48vw;margin-top:-2px;background:linear-gradient(90deg,transparent,rgba(255,110,30,.0) 8%,#ff9a52 30%,#fff 50%,#ff9a52 70%,rgba(255,110,30,0) 92%,transparent);filter:blur(1.5px);box-shadow:0 0 30px 6px rgba(255,120,40,.55);opacity:0;transform:scaleX(0);pointer-events:none;mix-blend-mode:screen}
  #mark{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);display:flex;justify-content:center;font-size:clamp(32px,10.5vw,150px);font-weight:900;color:#fff;letter-spacing:.2em;padding-left:.2em;text-shadow:0 0 40px rgba(255,90,10,.75),0 0 90px rgba(255,60,0,.5);pointer-events:none}
  #mark span{display:inline-block;opacity:0}
  #tag{position:absolute;left:0;right:0;top:calc(50% + clamp(34px,8vw,90px));text-align:center;color:#ffd9bf;font-size:clamp(10px,1.8vw,15px);letter-spacing:.42em;padding-left:.42em;font-weight:700;opacity:0;pointer-events:none}

  /* ---- date ---- */
  #date{background:var(--paper);color:#000}
  #date .lbl{font-size:clamp(11px,1.9vw,15px);letter-spacing:.42em;padding-left:.42em;font-weight:800;margin-bottom:2.6vh}
  #date .big{display:flex;font-size:clamp(72px,22vw,290px);font-weight:900;letter-spacing:-.03em;line-height:.95}
  #date .big .d{display:block;overflow:hidden;height:1.0em;padding-bottom:0}
  #date .big .d b{display:block;font-weight:900}
  #date .lock{margin-top:5.5vh;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0}
  #date .lock .row{display:flex;align-items:center;gap:14px;font-weight:900;letter-spacing:.38em;padding-left:.38em;font-size:clamp(14px,2.4vw,20px)}
  #date .lock img{height:38px;width:auto}
  #date .lock .t{font-size:clamp(10px,1.7vw,13px);letter-spacing:.3em;font-weight:600;opacity:.55}

  #replay{position:fixed;right:16px;bottom:16px;z-index:60;background:#000;color:#fff;border:1px solid #fff4;border-radius:999px;padding:11px 20px;font:800 12px var(--display);letter-spacing:.24em;cursor:pointer;display:none}
  #replay.on{display:block}
</style>
</head>
<body>
<div id="stage">
 <div id="cam">

  <div id="gate" class="scene on" role="button" tabindex="0" aria-label="Play teaser">
    <img data-logo alt="">
    <p class="xw">TAP TO PLAY</p>
    <small>SOUND ON FOR BEST EXPERIENCE</small>
  </div>

  <div id="call" class="scene">
    <div class="sb"><span>9:41</span><span class="ic"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="bat"></span></span></div>
    <div id="callBody">
      <div class="who"><img data-logo alt=""><span id="callName"></span></div>
      <div class="sub">is calling…</div>
      <div class="row"><div class="pill"><i>⏰</i>Remind Me</div><div class="pill"><i>💬</i>Message</div></div>
    </div>
    <div id="slider"><span>slide to answer</span><div id="knob">📞</div></div>
    <div class="home"></div>
  </div>

  <div id="words" class="scene light">
    <div class="idx xw" id="idx"></div>
    <div class="w xw" id="word"></div>
    <div class="ticks" id="ticks"></div>
  </div>

  <div id="eye" class="scene">
    <div id="skin"></div>
    <svg id="face" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1000 562">
      <defs>
        <radialGradient id="gSclera" cx=".5" cy=".5" r=".62"><stop offset="0" stop-color="#f6ebdf"/><stop offset=".6" stop-color="#e8d2bf"/><stop offset="1" stop-color="#b98672"/></radialGradient>
        <radialGradient id="gIris" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#140803"/><stop offset=".28" stop-color="#3b1a0a"/><stop offset=".52" stop-color="#7d4018"/><stop offset=".78" stop-color="#b8702e"/><stop offset=".92" stop-color="#8a4a1e"/><stop offset="1" stop-color="#190b04"/></radialGradient>
        <radialGradient id="gPupil" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000"/><stop offset=".82" stop-color="#000"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
        <radialGradient id="gShadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1c0a03" stop-opacity=".62"/><stop offset="1" stop-color="#1c0a03" stop-opacity="0"/></radialGradient>
        <radialGradient id="gHi" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffc99a" stop-opacity=".34"/><stop offset="1" stop-color="#ffc99a" stop-opacity="0"/></radialGradient>
        <linearGradient id="gLid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".82"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
        <filter id="b3" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
        <filter id="b8" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
        <filter id="b14" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
        <filter id="heat" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence id="heatTurb" type="fractalNoise" baseFrequency="0.01 0.024" numOctaves="2" seed="4" result="n"/>
          <feDisplacementMap id="heatMap" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <clipPath id="eyeClip"><path id="clipP" d=""/></clipPath>
        <clipPath id="irisClip"><circle r="128"/></clipPath>
      </defs>
      <g id="world">
        <!-- skin shading -->
        <ellipse cx="500" cy="120" rx="520" ry="190" fill="url(#gShadow)"/>
        <ellipse cx="30" cy="300" rx="190" ry="330" fill="url(#gShadow)"/>
        <ellipse cx="580" cy="520" rx="470" ry="170" fill="url(#gHi)"/>
        <ellipse cx="560" cy="40" rx="380" ry="60" fill="url(#gHi)" opacity=".8"/>
        <g id="brow"></g>
        <path id="fold" fill="rgba(60,22,8,.34)" filter="url(#b8)"/>
        <path id="crease" fill="none" stroke="#3a1c0e" stroke-width="6" stroke-linecap="round" opacity=".5" filter="url(#b3)"/>
        <!-- eye -->
        <g clip-path="url(#eyeClip)">
          <ellipse cx="500" cy="285" rx="420" ry="170" fill="url(#gSclera)"/>
          <ellipse cx="148" cy="304" rx="34" ry="22" fill="#d38a7c"/>
          <ellipse cx="140" cy="300" rx="12" ry="7" fill="#f2b8aa" opacity=".8"/>
          <g id="veins" fill="none" stroke="#c0534a" stroke-linecap="round" opacity=".28"></g>
          <g id="iris"></g>
          <rect id="lidShadow" x="90" y="100" width="820" height="150" fill="url(#gLid)"/>
          <rect id="lowShadow" x="90" y="330" width="820" height="60" fill="url(#gLid)" transform="translate(0 700) scale(1 -1)" opacity=".35"/>
        </g>
        <path id="lidLo" fill="none" stroke="#c97a6a" stroke-width="4" opacity="0"/>
        <path id="lidUp" fill="none" stroke="#150804" stroke-width="7" stroke-linecap="round"/>
        <path id="lashLo" fill="none" stroke="#150804" stroke-width="1.7" stroke-linecap="round" opacity="0"/>
        <path id="lashUp" fill="none" stroke="#120603" stroke-width="2.6" stroke-linecap="round"/>
        <!-- projected logo -->
        <g id="proj" opacity="0">
          <image id="projGlow" x="235" y="-72" width="570" height="641" style="mix-blend-mode:screen" opacity="0"/>
          <image id="projImg"  x="235" y="-72" width="570" height="641" opacity="0" style="mix-blend-mode:normal"/>
        </g>
      </g>
    </svg>
    <div id="dim"></div>
    <div id="ember"></div>
    <div id="vig"></div>
    <div id="flare"></div>
    <div id="mark" class="xw"></div>
    <div id="tag" class="xw"></div>
    <div class="bar" id="barT"></div><div class="bar" id="barB"></div>
  </div>

  <div id="date" class="scene">
    <div class="lbl xw" id="dLabel"></div>
    <div class="big xw" id="dBig"></div>
    <div class="lock"><div class="row xw"><img data-logo alt=""><span id="dBrand"></span></div><div class="t xw" id="dTag"></div></div>
  </div>
 </div>
 <canvas id="grain"></canvas>
 <div id="flash"></div>
 <button id="replay">REPLAY</button>
</div>

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
const lerp = (a,b,t) => a+(b-a)*t;
const E = {
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  inOutQuart:t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2,
  outCubic:t=>1-Math.pow(1-t,3),
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t)

document.querySelectorAll("[data-logo]").forEach(i => i.src = LOGO);

["callName","dBrand"].forEach(i => $(i).textContent = BRAND);
$("dLabel").textContent = LAUNCH_LABEL; $("dTag").textContent = TAGLINE; $("tag").textContent = EYE_TAG;

const scenes = ["gate","call","words","eye","date"].map($);
const show = id => scenes.forEach(s => s.classList.toggle("on", s.id===id));
let token = 0;

/* ---------- procedural helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NS = "http://www.w3.org/2000/svg";
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e}

/* build iris, veins, brow once */
const R = rng(7);
const iris = $("iris");
mk("circle",{r:128,fill:"url(#gIris)"},iris);
const fib = mk("g",{"clip-path":"url(#irisClip)"},iris);
for(let i=0;i<150;i++){
  const a=R()*Math.PI*2, r1=46+R()*24, r2=Math.min(126,r1+26+R()*58), dark=R()>.5;
  mk("line",{x1:Math.cos(a)*r1,y1:Math.sin(a)*r1,x2:Math.cos(a+.05)*r2,y2:Math.sin(a+.05)*r2,
    stroke:dark?"rgba(20,8,2,.5)":"rgba(255,176,86,.38)","stroke-width":.7+R()*2.2,"stroke-linecap":"round"},fib);
}
mk("circle",{r:68,fill:"none",stroke:"rgba(255,170,70,.35)","stroke-width":6,filter:"url(#b3)"},fib);
mk("circle",{r:121,fill:"none",stroke:"rgba(10,4,1,.85)","stroke-width":14,filter:"url(#b3)"},fib);
const pupil = mk("circle",{r:50,fill:"url(#gPupil)"},iris);
const refl = mk("image",{x:-66,y:-72,width:62,height:70,opacity:0,style:"mix-blend-mode:screen"},iris);
refl.setAttribute("href",LOGO);
const catch1 = mk("ellipse",{cx:-46,cy:-54,rx:24,ry:13,fill:"#fff",opacity:.8,transform:"rotate(-28 -46 -54)",filter:"url(#b3)"},iris);
mk("ellipse",{cx:62,cy:50,rx:9,ry:6,fill:"#ffd2a8",opacity:.5,filter:"url(#b3)"},iris);

const veins=$("veins");
for(let i=0;i<9;i++){
  const left=i<5, x=left?150+R()*30:850-R()*30, y=285+R()*40-20, dx=(left?1:-1)*(60+R()*90);
  mk("path",{d:`M${x},${y} q${dx*.5},${(R()-.5)*30} ${dx},${(R()-.5)*50}`,"stroke-width":1+R()*1.4},veins);
}
const brow=$("brow");
mk("path",{d:"M110,-10 Q480,-125 940,-40",fill:"none",stroke:"rgba(18,8,3,.55)","stroke-width":52,"stroke-linecap":"round",filter:"url(#b14)"},brow);
let bd="";
for(let i=0;i<260;i++){
  const t=R(), bx=lerp(1-t,t,0)*0, u=1-t;
  const px=u*u*110+2*u*t*480+t*t*940, py=u*u*-10+2*u*t*-125+t*t*-40;
  const hh=22*Math.pow(Math.sin(Math.PI*clamp(t*.96+.02)),.5), oy=(R()-.5)*2*hh;
  const ang=(-35-45*R())*Math.PI/180*(t<.5?1:1), len=26+R()*30;
  const sx=px+(R()-.5)*8, sy=py+oy;
  bd+=`M${sx.toFixed(1)},${sy.toFixed(1)} q${(len*.5*Math.cos(ang)).toFixed(1)},${(len*.5*Math.sin(ang)+4).toFixed(1)} ${(len*Math.cos(ang)*.9+len*.25).toFixed(1)},${(len*Math.sin(ang)*.7).toFixed(1)}`;
}
mk("path",{d:bd,fill:"none",stroke:"rgba(22,10,4,.78)","stroke-width":2.3,"stroke-linecap":"round"},brow);

/* ---------- eye geometry ---------- */
const P0=[130,300], P2=[870,268];
const cub=(a,b,c,d,t)=>{const u=1-t;return[u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0],u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]]};
const cubD=(a,b,c,d,t)=>{const u=1-t;return[3*u*u*(b[0]-a[0])+6*u*t*(c[0]-b[0])+3*t*t*(d[0]-c[0]),3*u*u*(b[1]-a[1])+6*u*t*(c[1]-b[1])+3*t*t*(d[1]-c[1])]};
const lashSeed=[],lashSeedL=[];
{const r=rng(21);for(let i=0;i<46;i++)lashSeed.push([r(),r()]);for(let i=0;i<30;i++)lashSeedL.push([r(),r()])}

function setEye(o){
  const U=190*o-22*(1-o), L=60*o+22*(1-o), k=1.35;
  const u1=[300,300-k*U], u2=[660,280-k*U], l1=[320,300+k*L], l2=[680,280+k*L];
  const upD=`M${P0} C${u1} ${u2} ${P2}`;
  $("clipP").setAttribute("d",`${upD} C${l2} ${l1} ${P0} Z`);
  $("lidUp").setAttribute("d",upD);
  $("lidLo").setAttribute("d",`M${P0} C${l1} ${l2} ${P2}`);
  $("lidLo").setAttribute("opacity",(.55*o).toFixed(3));
  const Uc=U*1.22+34, c1=[320,300-k*Uc], c2=[640,278-k*Uc];
  $("crease").setAttribute("d",`M160,288 C${c1} ${c2} 850,262`);
  $("fold").setAttribute("d",`${upD} L850,262 C${c2} ${c1} 160,288 Z`);
  $("lidShadow").setAttribute("y",(292-U-30).toFixed(1));
  $("lowShadow").setAttribute("y",(700-(300+L)-52).toFixed(1));
  /* lashes */
  const op=clamp(o*1.7), phi=(1-op)*Math.PI, cp=Math.cos(phi), sp=Math.sin(phi);
  let d="";
  for(let i=0;i<lashSeed.length;i++){
    const t=clamp(.04+.92*i/(lashSeed.length-1)+(lashSeed[i][0]-.5)*.012);
    const p=cub(P0,u1,u2,P2,t), q=cubD(P0,u1,u2,P2,t), m=Math.hypot(q[0],q[1]), tx=q[0]/m, ty=q[1]/m;
    const nx=ty, ny=-tx;
    const len=(14+34*Math.pow(Math.sin(Math.PI*Math.pow(t,.8)),.8))*(.75+.5*lashSeed[i][1]);
    const dx=nx*cp+tx*sp*.6, dy=ny*cp+ty*sp*.6;
    const ex=p[0]+dx*len, ey=p[1]+dy*len, cx=p[0]+dx*len*.5+tx*len*.24*Math.abs(cp)+tx*3, cy=p[1]+dy*len*.5+ty*len*.24*Math.abs(cp);
    d+=`M${p[0].toFixed(1)},${p[1].toFixed(1)}Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;
  }
  $("lashUp").setAttribute("d",d);
  let dl="";
  for(let i=0;i<lashSeedL.length;i++){
    const t=.12+.8*i/(lashSeedL.length-1);
    const p=cub(P0,l1,l2,P2,t), q=cubD(P0,l1,l2,P2,t), m=Math.hypot(q[0],q[1]), tx=q[0]/m, ty=q[1]/m;
    const len=(7+11*Math.sin(Math.PI*t))*(.7+.6*lashSeedL[i][1]);
    dl+=`M${p[0].toFixed(1)},${p[1].toFixed(1)}l${(-ty*len+tx*4).toFixed(1)},${(tx*len+ty*4).toFixed(1)}`;
  }
  $("lashLo").setAttribute("d",dl);
  $("lashLo").setAttribute("opacity",(.7*clamp(o*2)).toFixed(3));
}
setEye(0);

/* ---------- viewport fit ---------- */
let S0=1.5,S1=.74,LANDSCAPE=true;
function fit(){
  const a=innerWidth/innerHeight; LANDSCAPE=a>1.15;
  const vw=LANDSCAPE?1000:640, vh=vw/a;
  $("face").setAttribute("viewBox",`${500-vw/2} ${285-vh/2} ${vw} ${vh}`);
  S0=LANDSCAPE?1.5:1.12; S1=LANDSCAPE?.74:.62;
  const g=$("grain"); g.width=Math.ceil(innerWidth/3); g.height=Math.ceil(innerHeight/3);
}
addEventListener("resize",fit); fit();

/* ---------- grain + camera loop ---------- */
const gx=$("grain").getContext("2d"); let gf=0, shakeUntil=0, shakeAmp=0, tickers=new Set();
function loop(now){
  if((gf++&1)===0){const g=$("grain"),w=g.width,h=g.height,id=gx.createImageData(w,h),d=id.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gx.putImageData(id,0,0)}
  if(now<shakeUntil){const k=(shakeUntil-now)/350*shakeAmp;$("cam").style.transform=`translate(${(Math.random()-.5)*k}px,${(Math.random()-.5)*k}px)`}
  else $("cam").style.transform="";
  tickers.forEach(f=>f(now));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
const shake=(amp=12,ms=350)=>{shakeAmp=amp;shakeUntil=performance.now()+ms};
function flash(color="#fff",ms=220,peak=.9){const f=$("flash");f.style.background=color;f.animate([{opacity:peak},{opacity:0}],{duration:ms,easing:"ease-out"})}

/* ---------- audio ---------- */
let AC,master,nbuf;
function initAudio(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    if(!master){
      master=AC.createGain();master.gain.value=.9;
      const c=AC.createDynamicsCompressor();master.connect(c);c.connect(AC.destination);
      nbuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
  }catch(e){}
}
function osc(type,f0,f1,dur,vol,delay=0){
  if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}catch(e){}
}
function noise(dur,vol,type,f0,f1,delay=0,q=1,attack=.01){
  if(!AC)return;try{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime+delay;
  s.buffer=nbuf;s.loop=true;f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05)}catch(e){}
}
const sRing=()=>{[0,.22,.44,.66].forEach((d,i)=>{osc("sine",i%2?1318:988,i%2?1318:988,.34,.14,d);osc("triangle",i%2?2636:1976,i%2?2636:1976,.2,.04,d)})};
const sTick=(i)=>{noise(.07,.5,"highpass",3500,3500,0,.7);osc("square",150+i*28,90+i*18,.09,.12)};
const sRiser=(dur)=>{noise(dur,.55,"bandpass",250,5200,0,3,dur*.9);osc("sawtooth",70,520,dur,.07)};
const sHit=()=>{osc("sine",78,30,1.9,1);noise(1.0,.7,"lowpass",3200,160,0,.8,.003);osc("sine",156,60,.7,.25)};
const sSpark=(i)=>osc("sine",1568*Math.pow(1.122,i),1568*Math.pow(1.122,i),.45,.05);
const sChime=()=>{osc("sine",1318,1318,1.2,.1);osc("sine",1976,1976,1.0,.06,.08);osc("sine",2637,2637,.9,.04,.16)};
const sWhoosh=()=>noise(.5,.35,"bandpass",400,3000,0,2,.2);

/* ---------- scene 1: call ---------- */
async function sceneCall(alive){
  show("call");$("call").classList.add("ring");
  const knob=$("knob"),max=$("slider").clientWidth-62;
  knob.style.transition="none";knob.style.transform="translateX(0)";
  sRing();await wait(1050);if(!alive())return false;sRing();await wait(900);if(!alive())return false;
  knob.style.transition="transform .6s cubic-bezier(.3,.7,.2,1)";knob.style.transform=`translateX(${max}px)`;
  sWhoosh();await wait(700);if(!alive())return false;
  $("call").classList.remove("ring");
  flash("#000",260,1);await wait(180);return alive();
}

/* ---------- scene 2: words ---------- */
async function sceneWords(alive){
  const box=$("words"),word=$("word"),ticks=$("ticks");
  ticks.innerHTML=WORDS.map(()=>"<i></i>").join("");
  for(let i=0;i<WORDS.length;i++){
    const [txt,theme,hold]=WORDS[i];
    show("words");box.className="scene on "+theme;
    $("idx").textContent="// 0"+(WORDS.length-i);
    [...ticks.children].forEach((t,k)=>t.classList.toggle("f",k<=i));
    word.innerHTML=[...txt].map(c=>`<span class="ch">${c===" "?"&nbsp;":c}</span>`).join("");
    word.getAnimations().forEach(a=>a.cancel());
    [...word.children].forEach((s,k)=>s.animate(
      [{transform:"translateY(75%) scaleY(1.6)",opacity:0,filter:"blur(14px)"},{transform:"none",opacity:1,filter:"blur(0)"}],
      {duration:280,delay:k*24,easing:"cubic-bezier(.15,.9,.2,1)",fill:"both"}));
    const last=i===WORDS.length-1;
    word.animate([{transform:"scale(.95)"},{transform:`scale(${last?1.12:1.04})`}],{duration:hold,easing:last?"cubic-bezier(.4,0,1,1)":"linear",fill:"forwards"});
    sTick(i);if(last){sRiser(1.9)}
    if(i<2){const g=word.animate([
      {transform:"translateX(-10px)",textShadow:"7px 0 #ff3d00,-7px 0 #00c8ff",clipPath:"inset(8% 0 52% 0)"},
      {transform:"translateX(12px)",textShadow:"-7px 0 #ff3d00,7px 0 #00c8ff",clipPath:"inset(50% 0 6% 0)"},
      {transform:"translateX(-4px)",textShadow:"4px 0 #ff3d00,-4px 0 #00c8ff",clipPath:"inset(0)"},
      {transform:"none",textShadow:"none",clipPath:"inset(0)"}],{duration:230,easing:"steps(4)"})}
    await wait(hold);if(!alive())return false;
  }
  return true;
}

/* ---------- scene 3: the eye ---------- */
const EYE_DUR=6.2;
function eyeFrame(t){
  const wob=3*Math.sin(t*.7), wob2=2*Math.cos(t*.9);
  /* openness */
  let o=0;
  if(t>.9)o=E.inOutCubic(clamp((t-.9)/1.8));
  if(t>3.0&&t<3.42){const k=(t-3.0)/.42;o*=1-Math.sin(Math.PI*k)*.94}
  setEye(o);
  /* camera */
  const k=E.inOutQuart(clamp((t-2.7)/1.9));
  const pre=S0*(1+.07*(1-clamp(t/2.7)));
  const s=lerp(pre,S1,k), rot=-2.6*k;
  $("world").setAttribute("transform",`translate(${500+wob-14*k} ${285+wob2+16*k}) rotate(${rot}) scale(${s}) translate(-500 -285)`);
  /* iris + pupil */
  const glance=E.inOutCubic(clamp((t-3.7)/.6));
  const ix=500+7*Math.sin(t*.8)-14*glance, iy=288+4*Math.sin(t*1.1)+3*glance;
  iris.setAttribute("transform",`translate(${ix} ${iy})`);
  let dil=.6+.4*E.inOutCubic(clamp((t-1.3)/1.3)); if(t>3.1)dil-=.28*E.outCubic(clamp((t-3.1)/.5));
  pupil.setAttribute("r",(50*dil).toFixed(1));
  const rf=.95*E.inOutCubic(clamp((o-.45)/.55))*(1-clamp((t-4.1)/.5)*.6);
  refl.setAttribute("opacity",rf.toFixed(3));
  const pulse=1+.06*Math.sin(t*6)*clamp((t-3.1)/.5);
  refl.setAttribute("transform",`scale(${pulse.toFixed(3)})`);
  catch1.setAttribute("opacity",(.8*clamp(o*2)).toFixed(3));
  /* light + mood */
  const ign=E.outCubic(clamp((t-3.1)/.8));
  let dim=t<.9?.72:lerp(.72,.18,E.inOutCubic(clamp((t-.9)/2.2)));
  dim=lerp(dim,.12,ign*.5); dim+=.5*E.inOutCubic(clamp((t-4.1)/.6));
  $("dim").style.opacity=clamp(dim,0,.8).toFixed(3);
  $("ember").style.opacity=(.1+.12*Math.sin(t*5)*(t<.9?1:0)+.22*clamp((t-.6)/1.8)+.5*ign).toFixed(3);
  /* projection */
  const pk=E.outCubic(clamp((t-3.15)/1.1)), fade=1-.5*E.inOutCubic(clamp((t-4.1)/.6));
  $("proj").setAttribute("opacity",1);
  const sc=.92+.08*pk, tr=`translate(520 250) scale(${sc.toFixed(3)}) translate(-520 -250)`;
  $("projImg").setAttribute("transform",tr);$("projGlow").setAttribute("transform",tr);
  $("projImg").setAttribute("opacity",(pk*.93*fade).toFixed(3));
  $("projGlow").setAttribute("opacity",(pk*.9*fade*(.8+.2*Math.sin(t*7))).toFixed(3));
  $("projImg").style.filter=`url(#heat) blur(${((1-pk)*20).toFixed(1)}px)`;
  $("projGlow").style.filter=`url(#heat) blur(${(10+(1-pk)*26).toFixed(1)}px) saturate(1.6)`;
  $("heatMap").setAttribute("scale",((1-pk)*55+(t>3.15?3:0)).toFixed(1));
  $("heatTurb").setAttribute("baseFrequency",`${(.01+.002*Math.sin(t*3)).toFixed(4)} ${(.024+.004*Math.cos(t*4)).toFixed(4)}`);
  /* letterbox */
  if(LANDSCAPE){const b=Math.max(0,(innerHeight-innerWidth/2.39)/2)*E.inOutCubic(clamp(t/.9));$("barT").style.height=$("barB").style.height=b+"px"}
}
async function sceneEye(alive){
  show("eye");
  const mark=$("mark");mark.innerHTML=[...BRAND].map(c=>`<span>${c}</span>`).join("");
  $("tag").style.opacity=0;$("flare").style.opacity=0;
  $("barT").style.height=$("barB").style.height="0px";
  eyeFrame(0);
  const T0=performance.now();
  const upd=()=>eyeFrame((performance.now()-T0)/1000);
  tickers.add(upd);
  const at=(ms,fn)=>setTimeout(()=>{if(alive())fn()},ms);
  at(250,()=>sRiser(2.85));
  at(3080,()=>{sHit();shake(16,380);flash("#ff6a1a",420,.55)});
  at(4000,()=>{
    sWhoosh();
    $("flare").animate([{opacity:0,transform:"scaleX(0)"},{opacity:1,transform:"scaleX(1)",offset:.35},{opacity:0,transform:"scaleX(1.15)"}],{duration:1500,easing:"cubic-bezier(.2,.8,.2,1)"});
    [...mark.children].forEach((s,i)=>{
      s.animate([{opacity:0,transform:"scale(1.7) translateY(8px)",filter:"blur(18px)"},{opacity:1,transform:"none",filter:"blur(0)"}],
        {duration:520,delay:i*85,easing:"cubic-bezier(.15,.9,.2,1)",fill:"forwards"});
      setTimeout(()=>alive()&&sSpark(i),i*85+120);
    });
  });
  at(4900,()=>$("tag").animate([{opacity:0,transform:"translateY(10px)"},{opacity:.95,transform:"none"}],{duration:700,fill:"forwards",easing:"ease-out"}));
  await wait(EYE_DUR*1000);
  tickers.delete(upd);
  return alive();
}

/* ---------- scene 4: date ---------- */
async function sceneDate(alive){
  flash("#fff",500,1);show("date");
  const big=$("dBig");
  big.innerHTML=[...LAUNCH_DATE].map(c=>`<span class="d"><b>${c}</b></span>`).join("");
  [...big.children].forEach((s,i)=>s.firstChild.animate([{transform:"translateY(105%)"},{transform:"none"}],{duration:800,delay:i*90,easing:"cubic-bezier(.15,.95,.2,1)",fill:"both"}));
  $("dLabel").animate([{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],{duration:700,easing:"ease-out",fill:"both"});
  document.querySelector("#date .lock").animate([{opacity:0,transform:"translateY(12px)"},{opacity:1,transform:"none"}],{duration:900,delay:900,easing:"ease-out",fill:"forwards"});
  sChime();
  await wait(1200);
  return alive();
}

async function play(){
  const my=++token, alive=()=>my===token;
  $("replay").classList.remove("on");initAudio();
  $("barT").style.height=$("barB").style.height="0px";
  if(!await sceneCall(alive))return;
  if(!await sceneWords(alive))return;
  flash("#000",400,1);show("eye");await wait(380);if(!alive())return;
  if(!await sceneEye(alive))return;
  if(!await sceneDate(alive))return;
  $("replay").classList.add("on");
}
$("gate").addEventListener("click",play);
$("gate").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")play()});
$("replay").addEventListener("click",play);
</script>
