<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALNIVO — Teaser</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  /* ====== EDIT THESE ====== */
  /* Config lives in the <script> at the bottom: BRAND, LAUNCH_DATE, LAUNCH_LABEL, WORDS */
  :root{
    --ember:#ff3d00; --amber:#ff8a00; --slate:#1b2230; --paper:#f4f4f6; --ink:#000;
    --display: "Archivo", "Arial Black", Impact, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:var(--display)}
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column}
  .scene.on{display:flex}

  /* start gate */
  #gate{cursor:pointer;color:#fff;gap:18px;text-align:center}
  #gate img{width:84px;height:auto}
  #gate p{font-size:14px;letter-spacing:.3em;font-stretch:125%;font-weight:700;opacity:.7}

  /* ---- scene 1: incoming call ---- */
  #call{background:radial-gradient(60% 50% at 25% 20%,#7a2cff 0,transparent 70%),radial-gradient(55% 55% at 85% 30%,#1c3dff 0,transparent 70%),radial-gradient(60% 50% at 70% 90%,#ff2fd0 0,transparent 70%),#14052e;justify-content:flex-start;color:#fff;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  #call .time{position:absolute;top:18px;left:24px;font-weight:600;font-size:15px}
  #call .who{margin-top:14vh;font-size:clamp(26px,5vw,38px);font-weight:500;display:flex;align-items:center;gap:12px}
  #call .who img{height:1.1em;width:auto}
  #call .sub{opacity:.7;margin-top:6px;font-size:18px}
  #call .row{display:flex;gap:min(26vw,180px);margin-top:28px}
  #call .pill{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
  #call .pill i{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);display:grid;place-items:center;font-style:normal;font-size:20px}
  #slider{position:absolute;bottom:9vh;left:50%;transform:translateX(-50%);width:min(88vw,420px);height:64px;border-radius:40px;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,70,220,.9));overflow:hidden}
  #slider span{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;opacity:.85;padding-left:40px}
  #knob{position:absolute;top:4px;left:4px;width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;transition:none}
  #call .bar{position:absolute;bottom:10px;left:50%;width:140px;height:5px;border-radius:3px;background:#fff;transform:translateX(-50%)}
  #call.ring .who{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.03)}}

  /* ---- scene 2: countdown words ---- */
  #words{transition:none}
  #words .idx{font-size:clamp(10px,1.6vw,13px);letter-spacing:.35em;font-stretch:125%;font-weight:600;margin-bottom:2.2vh;opacity:.6}
  #words .w{font-size:clamp(40px,11vw,150px);font-weight:900;font-stretch:125%;letter-spacing:-.02em;line-height:1;white-space:nowrap;position:relative}
  #words.light{background:var(--paper);color:#000}
  #words.dark{background:#000;color:#fff}
  .glitch{animation:glitch .09s steps(2) infinite}
  @keyframes glitch{
    0%{transform:translate(-6px,0);clip-path:inset(10% 0 55% 0);text-shadow:4px 0 var(--ember),-4px 0 #00c8ff}
    50%{transform:translate(8px,0);clip-path:inset(55% 0 10% 0);text-shadow:-4px 0 var(--ember),4px 0 #00c8ff}
    100%{transform:translate(0,0);clip-path:inset(0)}
  }
  .grain::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;background-image:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px)}

  /* ---- scene 3: logo reveal ---- */
  #reveal{background:#000}
  #reveal .lw{position:relative;height:min(58vh,420px);aspect-ratio:595/669}
  #reveal img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #reveal .glow{position:absolute;inset:-30%;background:radial-gradient(closest-side,rgba(255,80,0,.35),transparent 70%);opacity:0}
  #reveal .name{margin-top:3vh;color:#fff;font-weight:900;font-stretch:125%;font-size:clamp(22px,5vw,44px);letter-spacing:.42em;padding-left:.42em;opacity:0}
  #reveal.go .lw img{animation:logoin 1.6s cubic-bezier(.2,.7,.1,1) forwards}
  #reveal.go .glow{animation:glow 2.4s ease-out forwards}
  #reveal.go .name{animation:fade 1s .9s forwards}
  @keyframes logoin{0%{opacity:0;transform:scale(1.35) rotate(-12deg);filter:blur(14px)}100%{opacity:1;transform:none;filter:none}}
  @keyframes glow{0%{opacity:0}40%{opacity:1}100%{opacity:.55}}
  @keyframes fade{to{opacity:1}}

  /* ---- scene 4: date ---- */
  #date{background:var(--paper);color:#000}
  #date .lbl{font-size:clamp(10px,1.8vw,14px);letter-spacing:.4em;padding-left:.4em;font-stretch:125%;font-weight:700;margin-bottom:2.4vh}
  #date .big{font-size:clamp(64px,20vw,260px);font-weight:900;font-stretch:125%;letter-spacing:-.03em;line-height:.95}
  #date .brand{margin-top:5vh;display:flex;align-items:center;gap:12px;font-weight:800;font-stretch:125%;letter-spacing:.35em;font-size:clamp(12px,2vw,16px);opacity:0}
  #date .brand img{height:30px;width:auto;mix-blend-mode:normal;background:#000;border-radius:6px;padding:4px}
  #date.go .brand{animation:fade 1s .8s forwards}
  #date.go .big,#date.go .lbl{animation:rise .9s cubic-bezier(.2,.7,.1,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  #replay{position:fixed;right:16px;bottom:16px;z-index:9;background:#000;color:#fff;border:1px solid #fff5;border-radius:999px;padding:10px 18px;font:700 12px var(--display);letter-spacing:.2em;cursor:pointer;display:none}
  #replay.on{display:block}
  @media (prefers-reduced-motion:reduce){.glitch,#call.ring .who{animation:none}}
</style>
</head>

  </div>

  <button id="replay">REPLAY</button>
</div>

<script>
/* ============ CONFIG — edit these ============ */
const BRAND         = "CALNIVO";
const LAUNCH_DATE   = "12.01";          // big text on the final card
const LAUNCH_LABEL  = "DECEMBER 1";     // small text above it
// Countdown words: [text, background]  (indexes count down automatically)
const WORDS = [
  ["ARE YOU","light"],
  ["READY?","light"],
  ["SOMETHING","dark"],
  ["BIG","light"],
  ["IS","dark"],
  ["COMING","dark"],
];
const WORD_MS = 700;   // time per word
/* ============================================== */

const $ = id => document.getElementById(id);
const scenes = ["gate","call","words","reveal","date"].map($);
const show = id => scenes.forEach(s => s.classList.toggle("on", s.id===id));
const wait = ms => new Promise(r => setTimeout(r, ms));
let token = 0;

["callName","revealName","dBrand"].forEach(i => $(i).textContent = BRAND);
$("dLabel").textContent = LAUNCH_LABEL; $("dBig").textContent = LAUNCH_DATE;

/* tiny WebAudio helpers (no assets needed) */
let ac;
function tone(f,d=.12,type="sine",v=.15,t0=0){
  if(!ac) return; const o=ac.createOscillator(), g=ac.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  const t=ac.currentTime+t0; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.start(t);o.stop(t+d+.02);
}
const ring = () => { [880,1174,880,1174].forEach((f,i)=>tone(f,.18,"triangle",.12,i*.2)); };
const tick = () => tone(140,.09,"square",.12);
const boom = () => { tone(55,1.6,"sine",.5); tone(110,1.2,"sawtooth",.08); };

async function play(){
  const my = ++token; const alive = () => my===token;
  $("replay").classList.remove("on");
  ac = ac || new (window.AudioContext||window.webkitAudioContext)();

  /* 1 — incoming call */
  show("call"); $("call").classList.add("ring");
  const knob=$("knob"), maxX=$("slider").clientWidth-60;
  knob.style.transform="translateX(0)";
  ring(); await wait(1100); if(!alive())return; ring(); await wait(1000); if(!alive())return;
  knob.style.transition="transform .55s cubic-bezier(.3,.7,.2,1)"; knob.style.transform=`translateX(${maxX}px)`;
  await wait(650); if(!alive())return; knob.style.transition="none";
  $("call").style.transition="opacity .25s"; $("call").style.opacity=0; await wait(260); if(!alive())return;
  $("call").style.opacity=1; $("call").classList.remove("ring");

  /* 2 — countdown words */
  const box=$("words");
  for(let i=0;i<WORDS.length;i++){
    const [txt,bg]=WORDS[i];
    show("words"); box.className="scene on grain "+bg;
    $("idx").textContent="// 0"+(WORDS.length-i);
    const w=$("word"); w.textContent=txt; tick();
    if(i<2){ w.classList.add("glitch"); await wait(190); w.classList.remove("glitch"); await wait(WORD_MS-190); }
    else await wait(WORD_MS);
    if(!alive())return;
  }

  /* 3 — logo reveal (replaces the eye close-up) */
  show("reveal"); const rv=$("reveal"); rv.classList.remove("go"); void rv.offsetWidth; rv.classList.add("go"); boom();
  await wait(3000); if(!alive())return;

  /* 4 — date card */
  show("date"); const d=$("date"); d.classList.remove("go"); void d.offsetWidth; d.classList.add("go");
  tone(660,.4,"sine",.12); 
  $("replay").classList.add("on");
}

$("gate").addEventListener("click", play);
$("gate").addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" ") play(); });
$("replay").addEventListener("click", play);
</script>
